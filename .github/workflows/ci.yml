name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv python install  # version from .python-version
      - run: uv lock --check  # before sync, which would rewrite a stale lock
      - run: uv sync --all-extras --dev
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
