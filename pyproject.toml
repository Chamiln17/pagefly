[project]
name = "pagefly"
version = "0.1.0"
description = "Agentic AI landing page generator backend with FastAPI"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.2",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.3",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    # Capped to the 0.3 line the hackathon code was written against.
    "langchain>=0.3.23,<0.4",
    "langchain-core>=0.3.54,<0.4",
    "langchain-openai>=0.3.14,<0.4",
    "langchain-community>=0.3.21,<0.4",
    "langgraph>=0.3.31,<1",
    "openai>=1.75.0",
    "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.3.4",
    "mypy>=1.10.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["api", "agents", "core", "workflow"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
