[project]
name = "pagefly"
version = "0.1.0"
description = "Agentic AI landing page generator backend with FastAPI"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.2",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.3",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.2",
    "langchain>=1.4.3",
    "langchain-core>=1.6.7",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "openai>=1.75.0",
    "beautifulsoup4>=4.15.0",
    "langchain-tavily>=0.2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.3.4",
    "mypy>=1.10.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["api", "agents", "core", "workflow"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
extend-select = ["T20", "G"]  # print; logging format

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]  # the smoke script talks to its user
